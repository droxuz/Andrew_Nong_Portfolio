name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: my-react-app

      - name: Build
        run: npm run build
        working-directory: my-react-app

      - name: Deploy to gh-pages
        run: |
          npx gh-pages -d build \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        working-directory: my-react-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}